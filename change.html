<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Powerhouse Survival Game</title>

<style>
body{
    margin:0;
    background:linear-gradient(to bottom, #0f172a, #1e293b);
    font-family:'Segoe UI', Tahoma, sans-serif;
    color:white;
    text-align:center;
}

h1{
    margin-top:20px;
    font-weight:600;
    letter-spacing:1px;
}

#timer{
    font-size:20px;
    margin:15px 0;
    padding:8px 20px;
    background:rgba(255,255,255,0.08);
    display:inline-block;
    border-radius:20px;
    backdrop-filter:blur(5px);
}

.game{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:30px;
    padding:40px;
}

/* Plant Card */
.plant{
    background:rgba(255,255,255,0.05);
    padding:25px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    transition:0.3s;
    position:relative;
}

.plant:hover{
    transform:translateY(-5px);
}

/* HOUSE STRUCTURE */

.house-wrapper{
    position:relative;
    width:120px;
    margin:0 auto 15px auto;
}

/* Roof */
.roof{
    width:0;
    height:0;
    border-left:70px solid transparent;
    border-right:70px solid transparent;
    border-bottom:60px solid #b91c1c;
    margin:0 auto;
    position:relative;
}

/* Chimney */
.chimney{
    width:20px;
    height:40px;
    background:#444;
    position:absolute;
    top:-40px;
    right:25px;
    border-radius:3px;
}

/* House Body */
.house{
    width:120px;
    height:90px;
    background:linear-gradient(to bottom, #3b82f6, #1e40af);
    border-radius:8px;
    position:relative;
    box-shadow:inset 0 -5px 15px rgba(0,0,0,0.3);
}

/* Door */
.door{
    width:30px;
    height:45px;
    background:#78350f;
    position:absolute;
    bottom:0;
    left:45px;
    border-radius:5px 5px 0 0;
}

/* Windows */
.window{
    width:25px;
    height:25px;
    background:#facc15;
    position:absolute;
    top:25px;
    border-radius:4px;
    box-shadow:0 0 10px rgba(255,255,150,0.7);
}

.window.left{ left:15px; }
.window.right{ right:15px; }

/* Smoke */
.smoke{
    width:15px;
    height:15px;
    background:rgba(220,220,220,0.7);
    border-radius:50%;
    position:absolute;
    top:-60px;
    right:30px;
    animation:smokeRise 3s linear infinite;
    display:none;
}

@keyframes smokeRise{
    0%{transform:translateY(0) scale(1);opacity:0.8;}
    100%{transform:translateY(-50px) scale(1.5);opacity:0;}
}

/* Warning Badge */
.warning{
    position:absolute;
    top:15px;
    right:15px;
    background:#facc15;
    color:black;
    padding:5px 8px;
    border-radius:15px;
    font-size:12px;
    font-weight:bold;
    display:none;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}

/* Storage Bar */
.storage-bar{
    height:12px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
    margin-top:10px;
}

.storage-level{
    height:100%;
    background:linear-gradient(to right, #22c55e, #06b6d4);
    transition:width 0.4s ease;
}

/* Button */
button{
    margin-top:15px;
    padding:8px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:linear-gradient(to right, #3b82f6, #06b6d4);
    color:white;
    font-weight:500;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Dead State */
.dead .house{
    background:linear-gradient(to bottom, #7f1d1d, #450a0a);
}

.dead .window{
    background:#111;
    box-shadow:none;
}

/* Demand Bar */
.demand-bar{
    height:12px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
    margin-top:8px;
}

.demand-level{
    height:100%;
    background:linear-gradient(to right, #f97316, #ef4444);
    transition:width 0.4s ease;
}

/* Bar Labels */
.bar-label{
    font-size:12px;
    margin-top:8px;
    text-align:left;
    opacity:0.8;
}
</style>
</head>

<body>

<h1>⚡ Powerhouse Survival ⚡</h1>
<p>Connect plants to share fuel and survive as long as possible!</p>
<div id="timer">Time Survived: 0s</div>

<div class="game" id="game"></div>

<script>

const NUM_PLANTS = 6;
const FIXED_DEMAND = [1.2, 1.0, 1.5, 0.9, 1.3, 1.1];

let plants = [];
let connections = [];
let time = 0;
let gameOver = false;

const gameDiv = document.getElementById("game");

for(let i=0;i<NUM_PLANTS;i++){
    let plant = {
        id:i,
        storage:100,
        element:null
    };

    let div = document.createElement("div");
    div.className="plant";
    div.innerHTML=`
    <h3>Zone ${i+1}</h3>

    <div class="house-wrapper">
        <div class="roof">
            <div class="chimney"></div>
        </div>
        <div class="house">
            <div class="door"></div>
            <div class="window left"></div>
            <div class="window right"></div>
        </div>
        <div class="smoke" id="smoke${i}"></div>
    </div>

    <div class="warning" id="warning${i}">LOW FUEL</div>

    <div class="bar-label">Storage</div>
<div class="storage-bar">
    <div class="storage-level" id="storage${i}"></div>
</div>

<div class="bar-label">Demand</div>
<div class="demand-bar">
    <div class="demand-level" id="demand${i}"></div>
</div>

    <div class="storage-bar">
        <div class="storage-level" id="storage${i}"></div>
    </div>

    <button onclick="toggleConnection(${i})">
        Toggle Connect
    </button>
`;

    plant.element = div;
    plants.push(plant);
    gameDiv.appendChild(div);
}

function updateUI(){
    plants.forEach((p,i)=>{
        let percent = p.storage;
        if(percent < 0) percent = 0;

        document.getElementById("storage"+i).style.width = percent+"%";

        let smoke = document.getElementById("smoke"+i);
        let warning = document.getElementById("warning"+i);

        // ⚠ Show warning if storage below 30%
        if(p.storage < 30){
            warning.style.display = "block";
            smoke.style.display = "block";
            smoke.style.animationPlayState = "running";
        }
        // 🟢 If storage healthy compared to demand → stop smoke
        else if(p.storage > FIXED_DEMAND[i] * 20){
            warning.style.display = "none";
            smoke.style.display = "none";
        }
        else{
            warning.style.display = "none";
            smoke.style.display = "none";
        }

        if(p.storage <= 0){
            p.element.classList.add("dead");
        }
    });
}

function equalize(){
    if(connections.length < 2) return;

    let total = 0;
    connections.forEach(i=> total += plants[i].storage);
    let avg = total / connections.length;

    connections.forEach(i=>{
        plants[i].storage = avg;
    });
}

function toggleConnection(i){
    if(gameOver) return;

    if(connections.includes(i)){
        connections = connections.filter(x=>x!==i);
    }else{
        connections.push(i);
    }

    equalize();
}

function gameLoop(){
    if(gameOver) return;

    plants.forEach((p,i)=>{
        p.storage -= FIXED_DEMAND[i] * 0.5;
        if(p.storage <= 0){
            gameOver = true;
            alert("Game Over! Survived "+time+" seconds");
        }
    });

    equalize();
    updateUI();

    time++;
    document.getElementById("timer").innerText="Time Survived: "+time+"s";
}

setInterval(gameLoop,1000);
updateUI();

</script>

</body>
</html>
