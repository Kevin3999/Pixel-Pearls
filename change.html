<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⚡ City Power Survival</title>
<style>
body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:linear-gradient(to bottom, #0a0f1c, #1c2738);
    color:white;
    text-align:center;
    overflow-x:hidden;
}
h1{
    margin-top:20px;
    font-weight:600;
}
#timer{
    font-size:18px;
    margin:15px 0;
    padding:8px 18px;
    background:rgba(255,255,255,0.08);
    border-radius:20px;
    display:inline-block;
}
/* Game Container with Canvas overlay */
.game-container{
    position:relative;
    padding:40px;
    display:grid;
    grid-template-columns:repeat(3, 1fr); /* 3 buildings per row */
    gap:30px;
    justify-items:center;
}
canvas#connections{
    position:absolute;
    top:0;
    left:0;
    pointer-events:none;
    z-index:0;
    width:100%;
    height:100%;
}
.building{
    background:rgba(255,255,255,0.05);
    padding:20px;
    border-radius:15px;
    backdrop-filter:blur(8px);
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    position:relative;
    cursor:pointer;
    transition:0.3s;
    z-index:1;
}
.building:hover{
    transform:translateY(-5px);
}
/* Roof and chimney */
.roof{
    width:0;
    height:0;
    border-left:50px solid transparent;
    border-right:50px solid transparent;
    border-bottom:40px solid #b91c1c;
    margin:0 auto;
    position:relative;
}
.chimney{
    width:15px;
    height:30px;
    background:#444;
    position:absolute;
    top:-30px;
    right:15px;
    border-radius:2px;
}
/* Building body */
.body{
    width:100px;
    height:80px;
    background:linear-gradient(to bottom,#3b82f6,#1e40af);
    border-radius:6px;
    position:relative;
    margin:0 auto;
}
.window{
    width:20px;
    height:20px;
    background:#facc15;
    position:absolute;
    border-radius:3px;
    top:20px;
    box-shadow:0 0 8px rgba(255,255,150,0.7);
}
.window.left{ left:15px; }
.window.right{ right:15px; }
/* Smoke */
.smoke{
    width:12px;
    height:12px;
    background:rgba(220,220,220,0.7);
    border-radius:50%;
    position:absolute;
    top:-50px;
    right:20px;
    animation:smokeRise 3s linear infinite;
    display:none;
}
@keyframes smokeRise{
    0%{transform:translateY(0) scale(1);opacity:0.8;}
    100%{transform:translateY(-50px) scale(1.5);opacity:0;}
}
/* Warning */
.warning{
    position:absolute;
    top:8px;
    right:8px;
    background:#facc15;
    color:black;
    padding:4px 6px;
    border-radius:12px;
    font-size:11px;
    font-weight:bold;
    display:none;
    animation:pulse 1s infinite;
}
@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.1);}
    100%{transform:scale(1);}
}
/* Bars */
.bar-label{
    font-size:11px;
    margin-top:6px;
    text-align:left;
    opacity:0.8;
}
.storage-bar, .demand-bar{
    height:10px;
    border-radius:15px;
    overflow:hidden;
    margin-top:4px;
    background:#334155;
}
.storage-level{
    height:100%;
    background:linear-gradient(to right,#22c55e,#06b6d4);
    transition:width 0.4s ease;
}
.demand-level{
    height:100%;
    background:linear-gradient(to right,#f97316,#ef4444);
    transition:width 0.4s ease;
}
/* Dead state */
.dead .body{
    background:linear-gradient(to bottom,#7f1d1d,#450a0a);
}
.dead .window{
    background:#111;
    box-shadow:none;
}
.selected{
    box-shadow:0 0 20px 4px #facc15;
}
</style>
</head>
<body>

<h1>⚡ City Power Survival ⚡</h1>
<div id="timer">Time Survived: 0s</div>
<div class="game-container" id="game-container">
    <canvas id="connections"></canvas>
    <div class="game" id="game"></div>
</div>

<script>
const BUILDINGS = [
    {name:"Power Plant", demand:1.5},
    {name:"Industry", demand:1.3},
    {name:"House", demand:1.0},
    {name:"School", demand:0.9},
    {name:"Hospital", demand:1.2},
    {name:"Mall", demand:1.1}
];
const MAX_DEMAND = 2;
let buildings = [];
let connections = [];
let selectedBuilding = null;
let time = 0;
let gameOver = false;

const gameDiv = document.getElementById("game");
const canvas = document.getElementById("connections");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = gameDiv.offsetWidth;
    canvas.height = gameDiv.offsetHeight;
}
window.addEventListener("resize",resizeCanvas);
resizeCanvas();

// Create buildings
BUILDINGS.forEach((b,i)=>{
    let building = {id:i, storage:100, element:null, demand:b.demand, name:b.name};
    let div = document.createElement("div");
    div.className="building";
    div.innerHTML=`
        <h3>${b.name}</h3>
        <div class="roof"><div class="chimney"></div></div>
        <div class="body">
            <div class="window left"></div>
            <div class="window right"></div>
        </div>
        <div class="smoke" id="smoke${i}"></div>
        <div class="warning" id="warning${i}">LOW FUEL</div>
        <div class="bar-label">Storage</div>
        <div class="storage-bar"><div class="storage-level" id="storage${i}"></div></div>
        <div class="bar-label">Demand</div>
        <div class="demand-bar"><div class="demand-level" id="demand${i}"></div></div>
    `;
    div.onclick = ()=>handleClick(i);
    building.element = div;
    buildings.push(building);
    gameDiv.appendChild(div);
});

function getCenter(el){
    const rect = el.getBoundingClientRect();
    const parentRect = gameDiv.getBoundingClientRect();
    return {
        x: rect.left - parentRect.left + rect.width/2,
        y: rect.top - parentRect.top + rect.height/2
    };
}

function drawConnections(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = "#00ffcc";
    ctx.lineWidth = 2;
    connections.forEach(pair=>{
        const start = getCenter(buildings[pair[0]].element);
        const end = getCenter(buildings[pair[1]].element);
        ctx.beginPath();
        ctx.moveTo(start.x,start.y);
        ctx.lineTo(end.x,end.y);
        ctx.stroke();
    });
}

function handleClick(i){
    if(gameOver) return;
    if(selectedBuilding === null){
        selectedBuilding = i;
        buildings[i].element.classList.add("selected");
    } else if(selectedBuilding === i){
        buildings[i].element.classList.remove("selected");
        selectedBuilding = null;
    } else {
        connections.push([selectedBuilding,i]);
        equalize([selectedBuilding,i]);
        buildings[selectedBuilding].element.classList.remove("selected");
        selectedBuilding = null;
        drawConnections();
    }
}

function equalize(ids){
    if(!ids || ids.length<2) return;
    let total = ids.reduce((sum,id)=>sum+buildings[id].storage,0);
    let avg = total/ids.length;
    ids.forEach(id=> buildings[id].storage=avg);
}

function updateUI(){
    buildings.forEach((b,i)=>{
        let storagePercent = Math.max(b.storage,0);
        document.getElementById("storage"+i).style.width = storagePercent+"%";
        let demandPercent = (b.demand/MAX_DEMAND)*100;
        document.getElementById("demand"+i).style.width = demandPercent+"%";

        let smoke = document.getElementById("smoke"+i);
        let warning = document.getElementById("warning"+i);
        let storageBar = document.getElementById("storage"+i);

        if(b.storage < 30){
            warning.style.display="block";
            smoke.style.display="block";
        } else {
            warning.style.display="none";
            smoke.style.display="none";
        }

        if(storagePercent < demandPercent){
            storageBar.style.background="linear-gradient(to right,#ef4444,#dc2626)";
        } else {
            storageBar.style.background="linear-gradient(to right,#22c55e,#06b6d4)";
        }

        if(b.storage<=0) b.element.classList.add("dead");
    });
    drawConnections();
    document.getElementById("timer").innerText="Time Survived: "+time+"s";
}

function gameLoop(){
    if(gameOver) return;
    buildings.forEach(b=>{
        b.storage -= b.demand*0.5;
        if(b.storage<=0){
            gameOver=true;
            alert("Game Over! Survived "+time+" seconds");
        }
    });
    connections.forEach(pair=>equalize(pair));
    updateUI();
    time++;
}

setInterval(gameLoop,1000);
updateUI();
</script>

</body>
</html>
