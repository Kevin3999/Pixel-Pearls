<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Powerhouse Grid Game</title>
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #1c1f2a;
    color: white;
    text-align: center;
}
h1 {
    margin: 20px 0;
}
#game-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 columns */
    grid-template-rows: repeat(2, auto);   /* 2 rows */
    gap: 20px;
    padding: 30px;
    justify-items: center;
}
.building {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 12px;
    width: 150px;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s;
}
.building:hover {
    transform: translateY(-5px);
}
.building h3 {
    margin: 10px 0;
    font-size: 16px;
}
.bar-label {
    font-size: 12px;
    text-align: left;
    margin-top: 8px;
    opacity: 0.8;
}
.bar-container {
    height: 12px;
    width: 100%;
    background: #334155;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 4px;
}
.storage-level {
    height: 100%;
    background: #22c55e;
    width: 100%;
    transition: width 0.4s;
}
.demand-level {
    height: 100%;
    background: #f97316;
    width: 60%;
    transition: width 0.4s;
}
.warning {
    position: absolute;
    top: 8px;
    right: 8px;
    background: #facc15;
    color: black;
    padding: 3px 6px;
    border-radius: 10px;
    font-size: 11px;
    display: none;
}
.smoke {
    width: 10px;
    height: 10px;
    background: rgba(200,200,200,0.7);
    border-radius: 50%;
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
}
.selected {
    box-shadow: 0 0 15px 3px #facc15;
}
</style>
</head>
<body>

<h1>⚡ Powerhouse Grid Game ⚡</h1>

<div id="game-container"></div>

<script>
// ===== BUILDING DATA =====
const BUILDINGS = [
    {name:"Power Plant", storage:100, demand:1.5},
    {name:"Industry", storage:100, demand:1.3},
    {name:"House", storage:100, demand:1.0},
    {name:"School", storage:100, demand:0.9},
    {name:"Hospital", storage:100, demand:1.2},
    {name:"Mall", storage:100, demand:1.1},
];

const MAX_DEMAND = 3;
const TRANSFER_PERCENTAGE = 0.3; // 30% of first building's storage

let buildings = [];
let selectedBuilding = null;

const container = document.getElementById("game-container");

// ===== CREATE BUILDINGS =====
BUILDINGS.forEach((b, i) => {
    let building = {
        id: i,
        name: b.name,
        storage: b.storage,
        demand: b.demand,
        element: null,
        demandInput: null
    };

    const div = document.createElement("div");
    div.className = "building";
    div.innerHTML = `
        <h3>${b.name}</h3>
        <div class="smoke"></div>
        <div class="warning">LOW FUEL</div>
        <div class="bar-label">Storage</div>
        <div class="bar-container"><div class="storage-level"></div></div>
        <div class="bar-label">Demand</div>
        <div class="bar-container"><div class="demand-level"></div></div>
        <input type="range" min="0" max="${MAX_DEMAND}" step="0.1" value="${b.demand}" style="width:100%; margin-top:5px;">
    `;
    container.appendChild(div);

    const demandInput = div.querySelector("input");
    demandInput.addEventListener("input", e => {
        building.demand = parseFloat(e.target.value);
    });

    div.addEventListener("click", () => selectBuilding(building));

    building.element = div;
    building.demandInput = demandInput;

    buildings.push(building);
});

// ===== SELECT AND TRANSFER POWER =====
function selectBuilding(building){
    if(selectedBuilding === null){
        selectedBuilding = building;
        building.element.classList.add("selected");
    } else if(selectedBuilding === building){
        selectedBuilding.element.classList.remove("selected");
        selectedBuilding = null;
    } else {
        // Transfer power from first to second building
        let transferAmount = selectedBuilding.storage * TRANSFER_PERCENTAGE;
        selectedBuilding.storage -= transferAmount;
        building.storage += transferAmount;
        selectedBuilding.element.classList.remove("selected");
        selectedBuilding = null;
        updateUI();
    }
}

// ===== UPDATE UI =====
function updateUI(){
    buildings.forEach(b => {
        const storageBar = b.element.querySelector(".storage-level");
        storageBar.style.width = Math.max(b.storage,0) + "%";

        const demandBar = b.element.querySelector(".demand-level");
        demandBar.style.width = (b.demand/MAX_DEMAND*100) + "%";

        const warning = b.element.querySelector(".warning");
        const smoke = b.element.querySelector(".smoke");

        if(b.storage < 30){
            warning.style.display = "block";
            smoke.style.display = "block";
        } else {
            warning.style.display = "none";
            smoke.style.display = "none";
        }
    });
}

// ===== GAME LOOP =====
setInterval(() => {
    buildings.forEach(b => {
        b.storage -= b.demand * 0.5; // decrease storage according to demand
        if(b.storage < 0) b.storage = 0;
    });
    updateUI();
}, 1000);

updateUI();

</script>
</body>
</html>
