<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Powerhouse Survival Game</title>

<style>
body{
    margin:0;
    background:#141821;
    font-family:Arial, sans-serif;
    color:white;
    text-align:center;
}

h1{
    margin-top:20px;
}

.game{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:30px;
    padding:30px;
}

.plant{
    background:#232a3a;
    padding:20px;
    border-radius:15px;
    position:relative;
}

.storage-bar{
    height:20px;
    background:#444;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.storage-level{
    height:100%;
    background:linear-gradient(to right, #00ff88, #00ccff);
    transition:width 0.3s;
}

.smoke{
    width:20px;
    height:20px;
    background:rgba(200,200,200,0.7);
    border-radius:50%;
    margin:10px auto;
    animation:smokeRise 3s linear infinite;
}

@keyframes smokeRise{
    0%{transform:translateY(0);opacity:0.8;}
    100%{transform:translateY(-40px);opacity:0;}
}

button{
    margin-top:10px;
    padding:5px 10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:#008cff;
    color:white;
}

button:hover{
    background:#00aaff;
}

.dead{
    background:#8b0000 !important;
}

#timer{
    font-size:20px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>⚡ Powerhouse Survival ⚡</h1>
<p>Connect plants to share fuel and survive as long as possible!</p>
<div id="timer">Time Survived: 0s</div>

<div class="game" id="game"></div>

<script>

const NUM_PLANTS = 6;
const FIXED_DEMAND = [1.2, 1.0, 1.5, 0.9, 1.3, 1.1];

let plants = [];
let connections = [];
let time = 0;
let gameOver = false;

const gameDiv = document.getElementById("game");

for(let i=0;i<NUM_PLANTS;i++){
    let plant = {
        id:i,
        storage:100,
        element:null
    };

    let div = document.createElement("div");
    div.className="plant";
    div.innerHTML=`
        <h3>Zone ${i+1}</h3>
        <div class="smoke" id="smoke${i}"></div>
        <p>Demand: ${FIXED_DEMAND[i]}</p>
        <div class="storage-bar">
            <div class="storage-level" id="storage${i}"></div>
        </div>
        <button onclick="toggleConnection(${i})">Toggle Connect</button>
    `;

    plant.element = div;
    plants.push(plant);
    gameDiv.appendChild(div);
}

function updateUI(){
    plants.forEach((p,i)=>{
        let percent = p.storage;
        if(percent < 0) percent = 0;

        document.getElementById("storage"+i).style.width = percent+"%";

        let smoke = document.getElementById("smoke"+i);
        smoke.style.animationDuration = (4 - FIXED_DEMAND[i]) + "s";

        if(p.storage <= 0){
            p.element.classList.add("dead");
        }
    });
}

function equalize(){
    if(connections.length < 2) return;

    let total = 0;
    connections.forEach(i=> total += plants[i].storage);
    let avg = total / connections.length;

    connections.forEach(i=>{
        plants[i].storage = avg;
    });
}

function toggleConnection(i){
    if(gameOver) return;

    if(connections.includes(i)){
        connections = connections.filter(x=>x!==i);
    }else{
        connections.push(i);
    }

    equalize();
}

function gameLoop(){
    if(gameOver) return;

    plants.forEach((p,i)=>{
        p.storage -= FIXED_DEMAND[i] * 0.5;
        if(p.storage <= 0){
            gameOver = true;
            alert("Game Over! Survived "+time+" seconds");
        }
    });

    equalize();
    updateUI();

    time++;
    document.getElementById("timer").innerText="Time Survived: "+time+"s";
}

setInterval(gameLoop,1000);
updateUI();

</script>

</body>
</html>
